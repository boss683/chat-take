<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .form-container {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
        }
        
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .link {
            color: #6a11cb;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .success {
            background-color: #e6f7ee;
            color: #0d8b5a;
            border: 1px solid #0d8b5a;
        }
        
        .error {
            background-color: #fde8e8;
            color: #c53030;
            border: 1px solid #c53030;
        }
        
        .form-step {
            display: none;
        }
        
        .active {
            display: block;
        }
        
        .back-btn {
            background: #f1f1f1;
            color: #333;
            margin-bottom: 15px;
        }
        
        .back-btn:hover {
            background: #e0e0e0;
            transform: none;
            box-shadow: none;
        }
        
        .instructions {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .form-container {
                padding: 20px;
            }
            
            .links {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Account Access</h1>
            <p>Sign in or recover your password</p>
        </div>
        
        <div class="form-container">
            <!-- Login Form -->
            <div id="login-form" class="form-step active">
                <div id="login-message" class="message"></div>
                
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password">
                </div>
                
                <button id="login-btn" class="btn">Sign In</button>
                
                <div class="links">
                    <a href="#" class="link" id="forgot-link">Forgot Password?</a>
                    <a href="#" class="link" id="create-account-link">Create Account</a>
                </div>
            </div>
            
            <!-- Forgot Password Form -->
            <div id="forgot-form" class="form-step">
                <button class="btn back-btn" id="back-to-login">← Back to Login</button>
                
                <div id="forgot-message" class="message"></div>
                
                <h2 style="margin-bottom: 20px;">Reset Your Password</h2>
                <p class="instructions">Enter your email address and we'll send you a link to reset your password.</p>
                
                <div class="form-group">
                    <label for="forgot-email">Email Address</label>
                    <input type="email" id="forgot-email" placeholder="Enter your email">
                </div>
                
                <button id="send-reset-btn" class="btn">Send Reset Link</button>
            </div>
            
            <!-- Reset Password Form -->
            <div id="reset-form" class="form-step">
                <button class="btn back-btn" id="back-to-forgot">← Back</button>
                
                <div id="reset-message" class="message"></div>
                
                <h2 style="margin-bottom: 20px;">Create New Password</h2>
                <p class="instructions">Your new password must be different from previous used passwords.</p>
                
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="Enter new password">
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm new password">
                </div>
                
                <button id="reset-password-btn" class="btn">Change Password</button>
            </div>
            
            <!-- Create Account Form -->
            <div id="create-account-form" class="form-step">
                <button class="btn back-btn" id="back-to-login2">← Back to Login</button>
                
                <div id="create-account-message" class="message"></div>
                
                <h2 style="margin-bottom: 20px;">Create Account</h2>
                
                <div class="form-group">
                    <label for="create-name">Full Name</label>
                    <input type="text" id="create-name" placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="create-email">Email Address</label>
                    <input type="email" id="create-email" placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="create-password">Password</label>
                    <input type="password" id="create-password" placeholder="Create a password">
                </div>
                
                <div class="form-group">
                    <label for="create-confirm-password">Confirm Password</label>
                    <input type="password" id="create-confirm-password" placeholder="Confirm your password">
                </div>
                
                <button id="create-account-btn" class="btn">Create Account</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const loginForm = document.getElementById('login-form');
        const forgotForm = document.getElementById('forgot-form');
        const resetForm = document.getElementById('reset-form');
        const createAccountForm = document.getElementById('create-account-form');
        
        const loginMessage = document.getElementById('login-message');
        const forgotMessage = document.getElementById('forgot-message');
        const resetMessage = document.getElementById('reset-message');
        const createAccountMessage = document.getElementById('create-account-message');
        
        // Navigation Links
        document.getElementById('forgot-link').addEventListener('click', function(e) {
            e.preventDefault();
            showForm(forgotForm);
        });
        
        document.getElementById('create-account-link').addEventListener('click', function(e) {
            e.preventDefault();
            showForm(createAccountForm);
        });
        
        document.getElementById('back-to-login').addEventListener('click', function(e) {
            e.preventDefault();
            showForm(loginForm);
        });
        
        document.getElementById('back-to-forgot').addEventListener('click', function(e) {
            e.preventDefault();
            showForm(forgotForm);
        });
        
        document.getElementById('back-to-login2').addEventListener('click', function(e) {
            e.preventDefault();
            showForm(loginForm);
        });
        
        // Form Submission Handlers
        document.getElementById('login-btn').addEventListener('click', function() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if (!email || !password) {
                showMessage(loginMessage, 'Please enter both email and password.', 'error');
                return;
            }
            
            // In a real application, you would send this to a server
            showMessage(loginMessage, 'Login successful! Redirecting...', 'success');
            
            // Clear form
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        });
        
        document.getElementById('send-reset-btn').addEventListener('click', function() {
            const email = document.getElementById('forgot-email').value;
            
            if (!email) {
                showMessage(forgotMessage, 'Please enter your email address.', 'error');
                return;
            }
            
            // In a real application, you would send this to a server
            showMessage(forgotMessage, 'Password reset link has been sent to your email.', 'success');
            
            // Clear form
            document.getElementById('forgot-email').value = '';
            
            // Show reset form after a delay
            setTimeout(() => {
                showForm(resetForm);
            }, 2000);
        });
        
        document.getElementById('reset-password-btn').addEventListener('click', function() {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (!newPassword || !confirmPassword) {
                showMessage(resetMessage, 'Please enter and confirm your new password.', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage(resetMessage, 'Passwords do not match.', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage(resetMessage, 'Password must be at least 6 characters long.', 'error');
                return;
            }
            
            // In a real application, you would send this to a server
            showMessage(resetMessage, 'Your password has been changed successfully!', 'success');
            
            // Clear form
            document.getElementById('new-password').value = '';
            document.getElementById('confirm-password').value = '';
            
            // Redirect to login after a delay
            setTimeout(() => {
                showForm(loginForm);
            }, 2000);
        });
        
        document.getElementById('create-account-btn').addEventListener('click', function() {
            const name = document.getElementById('create-name').value;
            const email = document.getElementById('create-email').value;
            const password = document.getElementById('create-password').value;
            const confirmPassword = document.getElementById('create-confirm-password').value;
            
            if (!name || !email || !password || !confirmPassword) {
                showMessage(createAccountMessage, 'Please fill in all fields.', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage(createAccountMessage, 'Passwords do not match.', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage(createAccountMessage, 'Password must be at least 6 characters long.', 'error');
                return;
            }
            
            // In a real application, you would send this to a server
            showMessage(createAccountMessage, 'Account created successfully! You can now log in.', 'success');
            
            // Clear form
            document.getElementById('create-name').value = '';
            document.getElementById('create-email').value = '';
            document.getElementById('create-password').value = '';
            document.getElementById('create-confirm-password').value = '';
            
            // Redirect to login after a delay
            setTimeout(() => {
                showForm(loginForm);
            }, 2000);
        });
        
        // Helper Functions
        function showForm(form) {
            // Hide all forms
            loginForm.classList.remove('active');
            forgotForm.classList.remove('active');
            resetForm.classList.remove('active');
            createAccountForm.classList.remove('active');
            
            // Clear all messages
            loginMessage.style.display = 'none';
            forgotMessage.style.display = 'none';
            resetMessage.style.display = 'none';
            createAccountMessage.style.display = 'none';
            
            // Show the requested form
            form.classList.add('active');
        }
        
        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = 'message ' + type;
            element.style.display = 'block';
            
            // Scroll to message
            element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
